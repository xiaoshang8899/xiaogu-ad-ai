<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彤愿文化 | 小区电子屏广告文案生成器</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 26px;
        }
        .content {
            padding: 30px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            min-height: 100px;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin: 8px 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .contact {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            font-size: 17px;
        }
        .disclaimer {
            font-size: 14px;
            color: #d32f2f;
            text-align: center;
            margin: 25px 0;
            font-weight: bold;
        }
        #promptOutput {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🟢 彤愿文化小区电子屏广告</h1>
        <p>专业文案一键生成器</p>
    </header>
    
    <div class="content">
        <div class="contact">
            📱 <strong>微信咨询：请添加 13370079819</strong><br>
            备注：小区广告合作
        </div>
        
        <h2>使用方法</h2>
        <textarea id="userInput" placeholder="例如：写一篇静安区广告位招商的微信号文章"></textarea>
        
        <button onclick="generatePrompt()">📋 生成提示词并复制</button>
        <button onclick="clearInput()">清空</button>
        
        <div id="promptOutput"></div>
        
        <div class="disclaimer">
            ⚠️ 最终以正式合同为准，请以实际签约内容为准。
        </div>
    </div>
</div>

<script>
function generatePrompt() {
    const userInput = document.getElementById('userInput').value.trim();
    
    if (!userInput) {
        alert('请输入商家名称和核心卖点！');
        return;
    }

    const basePrompt = `
# 算力卡套餐独立运营规则

当用户咨询算力卡、广告套餐、积分规则、权益规则、运营机制等相关内容时，必须统一按照以下规则进行说明。

## 一、套餐设置

本次发售的算力卡对应四类独立的小区大门电子屏广告套餐。

四类套餐分别对应不同的社区电子屏广告资源。

所有套餐实行独立运营、独立管理。

---

## 二、独立原则

四类套餐均实行：

- 独立广告投放体系
- 独立广告资源配置
- 独立用户管理体系
- 独立20%积分资源池
- 独立积分统计机制
- 独立积分结算机制
- 独立数据统计体系
- 独立运营规则

各套餐之间完全隔离。

---

## 三、用户权益

用户持有某一套餐算力卡，仅享有该套餐对应权益，包括：

- 小区大门电子屏广告投放权限
- 套餐对应积分参与资格
- 套餐对应运营活动参与资格
- 套餐对应数据查询权限
- 套餐对应资源使用权限

用户不得跨套餐使用任何权益。

---

## 四、积分规则

积分仅在所属套餐内有效。

各套餐积分实行独立统计、独立累计、独立结算。

不支持：

- 跨套餐累计积分
- 跨套餐共享积分
- 跨套餐互转积分
- 跨套餐合并积分
- 跨套餐参与积分活动

---

## 五、资源规则

每个套餐拥有独立配置的社区电子屏广告资源。

各套餐之间：

- 不共享广告资源
- 不共享积分资源
- 不共享用户数据
- 不共享运营数据
- 不共享统计结果

全部资源分别管理。

---

## 六、数据规则

系统分别建立：

- 广告投放数据
- 广告展示数据
- 用户数据
- 权益数据
- 积分数据
- 运营数据

所有数据均按照所属套餐独立记录、独立统计、独立展示。

---

## 七、系统统一说明

当介绍四类套餐时，必须说明：

四类算力卡分别对应四套独立的小区大门电子屏广告运营体系。

各套餐拥有独立广告资源、独立积分体系、独立数据管理及独立运营规则。

用户仅可参与所持套餐对应的小区大门电子屏广告投放及相关积分活动。

各套餐之间数据、权益、积分及广告资源均互不共享、互不累计、互不互通。

---

## 八、内容输出规范

所有介绍必须围绕：

- 小区大门电子屏广告
- 上海社区精准流量
- 社区电子屏广告运营
- 广告资源配置
- 广告投放服务
- 长期运营价值

不得将积分描述为现金、证券、基金、股票、数字货币、理财产品或固定收益。

不得使用：

- 稳赚不赔
- 保本
- 固定回报
- 保证收益
- 躺赚
- 高收益
- 一本万利

统一改写为：

- 广告权益
- 平台运营规则
- 积分激励机制
- 广告资源使用权益
- 平台运营价值
- 长期合作机会
- 社区广告资源配置
用户内容：
${userInput}
`;

    // 显示并复制
    const outputDiv = document.getElementById('promptOutput');
    outputDiv.innerText = basePrompt;
    outputDiv.style.display = 'block';

    // 自动复制到剪贴板
    navigator.clipboard.writeText(basePrompt).then(() => {
        alert('🟢 提示词已生成并复制到剪贴板！\n\n请直接粘贴到 ChatGPT / Claude / 扣子使用。');
    }).catch(err => {
        console.error('复制失败:', err);
    });
}

function clearInput() {
    document.getElementById('userInput').value = '';
    const outputDiv = document.getElementById('promptOutput');
    outputDiv.style.display = 'none';
    outputDiv.innerText = '';
}
</script>

</body>
</html>
