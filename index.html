<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彤愿文化 | 小区电子屏广告文案生成器</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 26px;
        }
        .content {
            padding: 30px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            min-height: 100px;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin: 8px 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .contact {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            font-size: 17px;
        }
        .disclaimer {
            font-size: 14px;
            color: #d32f2f;
            text-align: center;
            margin: 25px 0;
            font-weight: bold;
        }
        #promptOutput {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🟢 彤愿文化小区电子屏广告</h1>
        <p>专业文案一键生成器</p>
    </header>
    
    <div class="content">
        <div class="contact">
            📱 <strong>微信咨询：请添加 13370079819</strong><br>
            备注：小区广告合作
        </div>
        
        <h2>使用方法</h2>
        <textarea id="userInput" placeholder="例如：写一篇静安区广告位招商的微信号文章"></textarea>
        
        <button onclick="generatePrompt()">📋 生成提示词并复制</button>
        <button onclick="clearInput()">清空</button>
        
        <div id="promptOutput"></div>
        
        <div class="disclaimer">
            ⚠️ 最终以正式合同为准，请以实际签约内容为准。
        </div>
    </div>
</div>
<script>
function generatePrompt() {
    const userInput = document.getElementById('userInput').value.trim();
    
    if (!userInput) {
        alert('请输入文案需求！例如平台、字数、宣传福利、目标区域');
        return;
    }
    const basePrompt = `
角色：彤愿文化广告招商文案一键生成器
公司：上海彤愿文化传播有限公司，主营上海小区门口电子屏广告投放。
覆盖区域：宝山、虹口、杨浦、静安、浦东、徐汇、普陀、闵行。
目标客户：餐饮店、美容美发、教育培训、家政、装修、房产、汽车服务、婚庆、新店开业等本地生活商户。
✅固定用词：只能使用【小区门口电子屏、小区大门电子大屏】
❌禁止词汇：电梯、灯箱、道闸、楼道。
套餐档位：299元7天体验套餐、999元、5500元、12000元年度套餐；按需可增加福利：签约年度套餐赠送永久线上广告位。
📜合规硬性规则：
1、严禁承诺收益、客源、回本、稳赚、保本、增收；只客观描述曝光、社区客流、品牌宣传价值。
2、SEO关键词自然穿插：上海小区门口电子屏广告、上海社区电子屏广告、上海社区广告位招商、社区广告位招商，不要堆砌。
3、输出体裁按需选择：严格按照各个平台规则，严禁出现违规的编辑内容
4、引流规范：正文**不直接放置手机号**；头条/小红书文末引导私信咨询；公众号软文可在文末放置电话。额外生成1条评论区置顶引流文案。符合各个平台，没有写的平台列出来单独生成
5、附加产出：配套标题、配图文案。
用户需求：${userInput}
直接输出定稿成品文案，不要多余解释。
`;
    // 显示并复制
    const outputDiv = document.getElementById('promptOutput');
    outputDiv.innerText = basePrompt;
    outputDiv.style.display = 'block';
    // 自动复制到剪贴板
    navigator.clipboard.writeText(basePrompt).then(() => {
        alert('🟢 优化后的提示词已生成并复制到剪贴板！\n\n粘贴到扣子智能体即可使用。');
    }).catch(err => {
        console.error('复制失败:', err);
    });
}
function clearInput() {
    document.getElementById('userInput').value = '';
    const outputDiv = document.getElementById('promptOutput');
    outputDiv.style.display = 'none';
    outputDiv.innerText = '';
}
</script>
</body>
</html>
